# Ежечасный сбор данных: выгрузка дня в data/history.json и обновление data/flats.json (scripts/collect_flats.py).
# Каждый запуск заменяет выгрузку за сегодня (по Тюмени), поэтому в истории остаётся последнее состояние за день.
# Запуск снаружи: cron-job.org раз в час вызывает workflow_dispatch через API GitHub. Расписание GitHub (schedule)
# не используется: запуски опаздывали на часы и пропадали. Вручную: Actions → «Сбор данных» → Run workflow.
# Если сервер застройщика перестал отвечать, собранное всё равно коммитится, а запуск помечается упавшим.
name: Сбор данных

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Yekaterinburg  # дата выгрузки — по Тюмени
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # свежий main, а не коммит на момент события: запуск из очереди увидит данные предыдущего

      - name: Собрать данные
        run: python3 scripts/collect_flats.py

      - name: Закоммитить data/
        if: ${{ !cancelled() }}
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo 'Данные не изменились'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898333+github-actions[bot]@users.noreply.github.com' \
              commit -m "upd data $(date '+%F %H:%M')"
          git pull --rebase
          git push
